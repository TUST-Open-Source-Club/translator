name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: --features vulkan
            model_dir: ~/.local/share/qwen-translate
          - os: macos-latest
            cargo_flags: --features metal
            model_dir: ~/Library/Application Support/qwen-translate
          - os: windows-latest
            cargo_flags: ""
            model_dir: ~/AppData/Local/qwen-translate
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang spirv-headers libvulkan-dev glslang-tools glslc

      - name: Windows build environment (static CRT, no VC++ redistributable needed)
        if: runner.os == 'Windows'
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "LLAMA_STATIC_CRT=1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release ${{ matrix.cargo_flags }}

      - name: Unit tests
        run: cargo test --release ${{ matrix.cargo_flags }}

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ${{ matrix.model_dir }}
          key: model-qwen35-2b-q4_k_m-v3

      - name: Smoke test (stdin pipe)
        run: |
          out=$(echo "I love programming" | ./target/release/translate --model-source huggingface)
          echo "en->zh: $out"
          echo "$out" | grep -q "编程"

      - name: Smoke test (CLI args)
        run: |
          out=$(./target/release/translate "今天天气很好")
          echo "zh->en: $out"
          echo "$out" | grep -qi "weather"

      - name: Smoke test (image translation)
        run: |
          out=$(./target/release/translate --model-source huggingface --image tests/fixtures/hello-en.png)
          echo "image->zh: $out"
          echo "$out" | grep -q "编程"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Smoke test (native messaging host, browser-style launch)
        run: |
          exe=./target/release/translate
          [ "$RUNNER_OS" = Windows ] && exe=./target/release/translate.exe
          python tests/native_host_smoke.py "$exe"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Cross-compile (aarch64-linux-android, API 24)
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ANDROID_API_LEVEL=24
          TC="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          cargo build --release --target aarch64-linux-android
          # Must run on a stock device: no libc++_shared.so / libomp.so dependency
          "$TC/llvm-readelf" -d target/aarch64-linux-android/release/translate | tee needed.txt
          ! grep -E "libc\+\+_shared|libomp" needed.txt

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Firefox and Chrome builds share their scripts
        run: |
          cmp firefox/background.js chrome/background.js
          cmp firefox/content.js chrome/content.js

      - name: Syntax and manifests
        run: |
          for f in firefox/*.js; do node --check "$f"; done
          python3 -m json.tool firefox/manifest.json > /dev/null
          python3 -m json.tool chrome/manifest.json > /dev/null

      - name: Pack CRX with a throwaway key (format check)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out test-key.pem
          python3 - <<'PY'
          import base64, json, subprocess
          der = subprocess.run(["openssl", "pkey", "-in", "test-key.pem", "-pubout", "-outform", "DER"],
                               capture_output=True, check=True).stdout
          m = json.load(open("chrome/manifest.json"))
          m["key"] = base64.b64encode(der).decode()
          import os, shutil
          shutil.copytree("chrome", "chrome-test")
          json.dump(m, open("chrome-test/manifest.json", "w"))
          PY
          python3 scripts/pack-crx.py chrome-test test-key.pem test.crx --zip test.zip --version 1.2.3
          head -c 4 test.crx | grep -q Cr24
          unzip -l test.zip
