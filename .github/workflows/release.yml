name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: --features vulkan
            target_name: linux-x86_64
          - os: macos-latest
            cargo_flags: --features metal
            target_name: macos-arm64
          - os: windows-latest
            cargo_flags: ""
            target_name: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang spirv-headers libvulkan-dev glslang-tools glslc rpm ruby ruby-dev build-essential libarchive-tools

      - name: Windows build environment (static CRT, no VC++ redistributable needed)
        if: runner.os == 'Windows'
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "LLAMA_STATIC_CRT=1" >> "$GITHUB_ENV"
          # llama.cpp's CMake takes the runtime from CMAKE_MSVC_RUNTIME_LIBRARY (see the file)
          echo "CMAKE_TOOLCHAIN_FILE=$(cygpath -m "$PWD/scripts/msvc-release.cmake")" >> "$GITHUB_ENV"

      - name: Generic Linux x86_64 CPU baseline
        if: runner.os == 'Linux'
        run: echo "CMAKE_TOOLCHAIN_FILE=$PWD/scripts/x86-baseline.cmake" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ hashFiles('scripts/*.cmake') }}

      - name: Build
        run: cargo build --locked --release ${{ matrix.cargo_flags }}

      - name: Verify generated x86_64 CPU baseline
        if: runner.os != 'macOS'
        run: python tests/check_x86_baseline.py

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip target/release/translate

      - name: Download model (for model-bundled packages)
        run: MODEL_SOURCE=huggingface bash scripts/download-model.sh

      - name: Assemble archives (without / with model)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          PKG="qwen-translate-${VER}-${{ matrix.target_name }}"
          case "$RUNNER_OS" in
            Windows) EXE=translate.exe; MODEL_DIR="$(cygpath -u "$LOCALAPPDATA")/qwen-translate" ;;
            macOS) EXE=translate; MODEL_DIR="$HOME/Library/Application Support/qwen-translate" ;;
            *) EXE=translate; MODEL_DIR="$HOME/.local/share/qwen-translate" ;;
          esac
          rm -rf "$PKG" dist
          mkdir -p "$PKG" dist
          cp "target/release/$EXE" "$PKG/"
          cp README.md README.zh-CN.md LICENSE "$PKG/"
          cp -r scripts firefox chrome "$PKG/"

          # zip on Windows, tar.xz elsewhere
          archive() {
            if [ "$RUNNER_OS" = Windows ]; then
              7z a -tzip -bd "dist/$1.zip" "$PKG" > /dev/null
            else
              tar -cJf "dist/$1.tar.xz" "$PKG"
            fi
          }
          archive "$PKG"
          mkdir -p "$PKG/model"
          cp "$MODEL_DIR/Qwen3.5-2B-Q4_K_M.gguf" "$MODEL_DIR/Qwen3.5-2B-mmproj-F16.gguf" "$PKG/model/"
          archive "$PKG-with-model"

          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$PKG".* "$PKG"-with-model.* > "$PKG-sha256sums.txt"
          else
            sha256sum "$PKG".* "$PKG"-with-model.* > "$PKG-sha256sums.txt"
          fi
          ls -lh

      - name: Build Linux packages (deb / rpm / pacman, without and with model)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo gem install fpm --no-document
          python3 scripts/package-linux.py "$GITHUB_REF_NAME"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_name }}
          path: dist/*
          compression-level: 0

  android:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Cross-compile (aarch64-linux-android, API 24)
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ANDROID_API_LEVEL=24
          TC="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          # NDK r30+ headers reject unversioned targets, which bindgen passes by default
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24"
          cargo build --release --target aarch64-linux-android
          "$TC/llvm-strip" target/aarch64-linux-android/release/translate

      - name: Build host downloader for Android package assembly
        run: cargo build --locked --release

      - name: Download model (for the model-bundled package)
        run: MODEL_SOURCE=huggingface bash scripts/download-model.sh

      - name: Assemble tar.xz archives (without / with model)
        run: |
          set -euo pipefail
          PKG="qwen-translate-${GITHUB_REF_NAME}-android-aarch64"
          rm -rf "$PKG" dist
          mkdir -p "$PKG/scripts" dist
          cp target/aarch64-linux-android/release/translate "$PKG/"
          cp README.md README.zh-CN.md LICENSE "$PKG/"
          cp scripts/install.sh scripts/download-model.sh "$PKG/scripts/"
          tar -cJf "dist/$PKG.tar.xz" "$PKG"
          mkdir -p "$PKG/model"
          MODEL_DIR="$HOME/.local/share/qwen-translate"
          cp "$MODEL_DIR/Qwen3.5-2B-Q4_K_M.gguf" "$MODEL_DIR/Qwen3.5-2B-mmproj-F16.gguf" "$PKG/model/"
          tar -cJf "dist/$PKG-with-model.tar.xz" "$PKG"
          cd dist
          sha256sum "$PKG.tar.xz" "$PKG-with-model.tar.xz" > "$PKG-sha256sums.txt"
          ls -lh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app (APK)
        env:
          # Release signing key (keytool keystore, base64) and its password; updates
          # of an installed app must be signed with the same key
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks")
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; the APK is signed with a throwaway debug key, so later versions can't be installed over it"
          fi
          APP_VERSION="${GITHUB_REF_NAME#v}" scripts/build-android-app.sh arm64-v8a
          rm -f "$RUNNER_TEMP/release.jks"
          APK="qwen-translate-${GITHUB_REF_NAME}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK"
          cd dist
          sha256sum "$APK" >> "qwen-translate-${GITHUB_REF_NAME}-android-aarch64-sha256sums.txt"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-aarch64
          path: dist/*
          compression-level: 0

  extension:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package browser extensions (Firefox zip, Chrome zip + CRX)
        env:
          # PEM private key matching the "key" in chrome/manifest.json
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Browsers accept 1-4 dot-separated integers only (v1.2.0-rc1 -> 1.2.0)
          EXT_VER="${VER%%-*}"
          PKG="qwen-translate-extension-${GITHUB_REF_NAME}"
          rm -rf stage dist
          mkdir -p stage dist
          for b in firefox chrome; do
            cp -r "$b" "stage/$b"
            jq --arg v "$EXT_VER" '.version = $v' "$b/manifest.json" > "stage/$b/manifest.json"
          done
          (cd stage/firefox && zip -qr -X "../../dist/$PKG-firefox.zip" .)
          if [ -n "${CRX_PRIVATE_KEY:-}" ]; then
            (umask 077 && printf '%s\n' "$CRX_PRIVATE_KEY" > crx-key.pem)
            python3 scripts/pack-crx.py stage/chrome crx-key.pem "dist/$PKG-chrome.crx" --zip "dist/$PKG-chrome.zip"
            rm -f crx-key.pem
          else
            echo "::warning::CRX_PRIVATE_KEY secret is not set; publishing the Chrome zip without a .crx"
            (cd stage/chrome && zip -qr -X "../../dist/$PKG-chrome.zip" .)
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: dist/*

  publish:
    # Publish whatever was built, even if one platform failed (the release is a draft)
    if: ${{ !cancelled() }}
    needs: [build, android, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # One job creates the release: parallel jobs uploading to a draft each
      # could otherwise end up creating several drafts for the same tag
      - name: Publish draft GitHub Release (review before publishing)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
