[package]
name = "translate"
version = "0.1.0"
edition = "2021"
description = "本地离线翻译 CLI（Qwen3.5-0.8B + llama.cpp）"
license = "GPL-3.0-only"
repository = "https://github.com/TUST-Open-Source-Club/translator"

[dependencies]
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common"] }
llama-cpp-sys-2 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
image = "0.25"

# Desktop: OpenMP threading (llama-cpp-2's default)
[target.'cfg(not(target_os = "android"))'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false, features = ["openmp"] }

# Android: static libc++ and ggml's own thread pool instead of OpenMP, since phones
# ship neither libc++_shared.so nor libomp.so; the binary then runs as-is (Termux, adb)
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false, features = ["android-static-stdcxx"] }

[features]
default = ["mtmd"]
mtmd = ["llama-cpp-2/mtmd", "llama-cpp-sys-2/mtmd"]
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]

[profile.release]
lto = "thin"
